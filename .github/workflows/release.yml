name: LM-Chat Automated Release & SemVer Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.jules/**'
      - '.gitignore'
      - '.github/workflows/test.yml'
      - '.github/workflows/jules-ci.yml'

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Automated SemVer Bump & Package Extension
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Commitizen
        run: |
          pip install commitizen

      - name: Run Commitizen Version Bump
        id: cz
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Attempt bump based on conventional commits
          cz bump --yes --changelog || echo "NO_BUMP=true" >> $GITHUB_ENV
          
          CURRENT_VERSION=$(cz version -p)
          echo "VERSION=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Push Version Bump & Tag
        if: env.NO_BUMP != 'true'
        run: |
          # Push tag independently to remote (tags do not violate refs/heads/main branch protection)
          git push origin ${{ steps.cz.outputs.TAG }} || true
          # Attempt to push commit to main, gracefully handling branch protection policies
          git push origin main || echo "Branch protection rule active on main: direct push bypassed, release & tag proceed."

      - name: Package Omniverse Extension Archive
        if: env.NO_BUMP != 'true'
        run: |
          # Package according to strict Omniverse Kit standards (folder name: orlandodorival.lm_chat)
          mkdir -p package_staging/orlandodorival.lm_chat
          cp -r exts/orlandodorival.lm_chat/* package_staging/orlandodorival.lm_chat/
          cp README.md LICENSE package_staging/orlandodorival.lm_chat/
          mkdir -p package_staging/orlandodorival.lm_chat/docs
          cp docs/CHANGELOG.md package_staging/orlandodorival.lm_chat/docs/
          # Ensure compiled cache directories are not included in release archive
          find package_staging -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          cd package_staging
          zip -r ../orlandodorival.lm_chat-${{ steps.cz.outputs.TAG }}.zip orlandodorival.lm_chat
          cd ..
          rm -rf package_staging

      - name: Create GitHub Release
        if: env.NO_BUMP != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.cz.outputs.TAG }}
          name: LM-Chat ${{ steps.cz.outputs.TAG }}
          body_path: docs/CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            orlandodorival.lm_chat-${{ steps.cz.outputs.TAG }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
