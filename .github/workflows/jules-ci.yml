name: Jules CI - Autonomous Agentic Test Suite

on:
  push:
    branches: [ "main", "jules/*", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Jules Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio pytest-mock aiohttp pydantic
        
    - name: Execute Test Suite with Omniverse Mocks
      run: |
        pytest tests/ -v --tb=short
