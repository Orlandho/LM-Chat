name: Jules CI - Autonomous Agentic Test Suite

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.jules/**'
      - '.gitignore'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.jules/**'
      - '.gitignore'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.github/workflows/release.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Execute Headless Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Install uv (Fast Python Package Manager)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11 via uv
        run: uv python install 3.11
          
      - name: Install Dependencies with Cache
        run: |
          uv pip install --system pytest pytest-asyncio pytest-mock aiohttp pydantic
          
      - name: Execute Test Suite with Omniverse Mocks
        run: |
          pytest tests/ -v --tb=short
